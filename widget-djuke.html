  <main>
    <h1>A cloneable DJuke</h1>
    <p>Real platform-backed single-song and playlist controls. Browsing is unsigned.
      Wallet approval occurs only after your explicit purchase or Save action.
      The shared host header owns your wallet and IPFS sessions.</p>

  <script type="module">
    import { mount } from './js/djuke-widget.mjs?v=20261107-review';
    const widget = mount(document.getElementById('djuke'), { ethers: window.ethers,
      config: {
        ipfsUploadServiceUrl: 'https://decentbusking.onrender.com',
        djukeContractAddress: '0xf51D2F7892cF9D49e14DF4afDf227a59ee170A51',
        djukeContractVersion: '0.5', djukePlaylistBatchEnabled: true,
        djukePlaylistBatchVersion: '0.5',
        djukePlaylistBatchAddress: '0xf51D2F7892cF9D49e14DF4afDf227a59ee170A51',
        djukePlaylistRadioReady: true
      }
    });
    window.addEventListener('pagehide', () => widget.destroy(), { once: true });
  </script>
