name: Validate Payroll Queue

on:
  push:
    branches: [main]
    paths:
      - payroll-queue.json
      - contributor-accounts.json
      - payroll-assets.json
      - scripts/commentArt.js
      - scripts/githubApi.js
      - scripts/payroll.js
      - scripts/processMergedBounty.js
      - scripts/processTestingBounty.js
      - scripts/sendContributorAlert.js
      - scripts/settlePayroll.js
      - scripts/validatePayrollQueue.js
      - test/automation.test.js
      - test/commentArt.test.js
      - test/payroll.test.js
      - .github/workflows/bounty-bot.yml
      - .github/workflows/testing-bounty.yml
      - .github/workflows/settle-payroll.yml
      - .github/workflows/validate-payroll-queue.yml
  pull_request:
    branches: [main]
    paths:
      - payroll-queue.json
      - contributor-accounts.json
      - payroll-assets.json
      - scripts/**
      - test/**
      - js/payroll.js
      - .github/workflows/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout revision
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_REF"
          git checkout --detach FETCH_HEAD

      - name: Validate ledger and tests
        run: |
          node scripts/validatePayrollQueue.js
          node --test test/payroll.test.js test/commentArt.test.js test/automation.test.js
