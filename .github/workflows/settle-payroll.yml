name: Settle Payroll

on:
  workflow_dispatch:
    inputs:
      contributor_github:
        description: Contributor GitHub username
        required: true
        type: string
      issue_ref:
        description: Issue ref (owner/repo#123)
        required: true
        type: string
      role:
        description: Work role recorded on the queue entry
        required: true
        type: choice
        options:
          - contributor
          - implementer
          - idea-originator
          - tester
      currency:
        description: Token symbol exactly as shown on the queue entry
        required: true
        type: string
      tx_hash:
        description: Confirmed transaction hash for this payment
        required: true
        type: string

permissions:
  contents: write
  issues: write

jobs:
  settle:
    if: github.actor == 'TheJollyLaMa'
    runs-on: ubuntu-latest
    concurrency:
      group: decentbusking-art-payroll-queue
      cancel-in-progress: false
    steps:
      - name: Checkout main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global credential.helper store
          printf 'https://x-access-token:%s@github.com\n' "$GH_TOKEN" > "$HOME/.git-credentials"
          chmod 600 "$HOME/.git-credentials"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main FETCH_HEAD

      - name: Install proof verifier dependencies
        run: npm ci --prefix discord-bot --ignore-scripts

      - name: Settle matching ledger entries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_CONTRIBUTOR_GITHUB: ${{ github.event.inputs.contributor_github }}
          INPUT_ISSUE_REF: ${{ github.event.inputs.issue_ref }}
          INPUT_ROLE: ${{ github.event.inputs.role }}
          INPUT_CURRENCY: ${{ github.event.inputs.currency }}
          INPUT_TX_HASH: ${{ github.event.inputs.tx_hash }}
        run: node scripts/settlePayroll.js

      - name: Validate and test
        run: |
          node scripts/validatePayrollQueue.js
          node --test test/payroll.test.js test/commentArt.test.js test/automation.test.js

      - name: Commit ledger update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payroll-queue.json contributor-accounts.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record confirmed payroll settlement"
          git pull --rebase origin main
          git push origin HEAD:main
