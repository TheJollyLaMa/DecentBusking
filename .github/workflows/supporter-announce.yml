name: Announce Supporter DNFT
# Standard Decent Supporter announcement (DecentHead product kit, docs/SUPPORTER-PRODUCTS.md).
# Bump the DecentHead SHA in both places, and in the sibling supporter workflow, together.
on:
  schedule:
    - cron: '29,59 * * * *'
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: Prepared release tag (blank scans releases awaiting delivery)
        required: false
      mint_evidence:
        description: Public Studio evidence JSON to register once (requires tag)
        required: false
permissions:
  contents: write
  issues: write
concurrency:
  group: supporter-${{ github.repository }}
  cancel-in-progress: false
jobs:
  announce:
    if: ${{ vars.SUPPORTER_DISCORD_ENABLED == 'true' }}
    uses: TheJollyLaMa/DecentHead/.github/workflows/product-supporter-announce.yml@3b2a72f7f8c49fb2af89ea7df2ead8e338e0e870
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name || '' }}
      mint_evidence: ${{ inputs.mint_evidence || '' }}
      head_ref: 3b2a72f7f8c49fb2af89ea7df2ead8e338e0e870
      ens_rpc_url: ${{ vars.SUPPORTER_ENS_RPC_URL || 'https://ethereum-rpc.publicnode.com' }}
    secrets:
      DISCORD_SUPPORTER_WEBHOOK: ${{ secrets.DISCORD_SUPPORTER_WEBHOOK }}
