  <g font-family="Georgia,serif" font-weight="bold" text-anchor="middle">
    <text fill="#76ffe8" font-size="29" letter-spacing="4"><textPath xlink:href="#eyebrow" startOffset="50%">DecentAgency presents</textPath></text>
    <text fill="url(#electric)" stroke="#bbff7d" stroke-width=".6" filter="url(#glow)" font-size="89" font-style="italic" letter-spacing="-3"><textPath xlink:href="#headline" startOffset="50%" textLength="840" lengthAdjust="spacingAndGlyphs">The world is</textPath></text>
    <text fill="url(#pink)" stroke="#ff9df0" stroke-width=".6" filter="url(#glow)" font-size="103" font-style="italic" letter-spacing="-3"><textPath xlink:href="#village" startOffset="50%" textLength="850" lengthAdjust="spacingAndGlyphs">your village,</textPath></text>
    <text fill="url(#electric)" stroke="#bbff7d" stroke-width=".6" filter="url(#glow)" font-size="73" font-style="italic" letter-spacing="-2"><textPath xlink:href="#home" startOffset="50%" textLength="860" lengthAdjust="spacingAndGlyphs">Busk from home!</textPath></text>
    <text fill="#d0ff43" font-size="28" font-style="italic"><textPath xlink:href="#brand" startOffset="50%">decentbusking.decentagency.eth</textPath></text>

    <text fill="#542652" stroke="#542652" stroke-width=".7" font-size="65" font-style="italic"><textPath xlink:href="#calendar" startOffset="50%" textLength="860" lengthAdjust="spacingAndGlyphs">Come make some plans</textPath></text>
    <text x="600" y="735" fill="#542652" font-size="30">Community calendar / right ankh / Public Schedule</text>
    <text x="600" y="776" fill="#542652" font-size="29" font-style="italic">One click to sync it to your own calendar.</text>

    <text fill="#482149" stroke="#482149" stroke-width=".7" font-size="64" font-style="italic"><textPath xlink:href="#ad" startOffset="50%" textLength="860" lengthAdjust="spacingAndGlyphs">Run an ad. Fuel the funds.</textPath></text>
    <text x="600" y="948" fill="#482149" font-size="30">Your project. Your event. Your public announcement.</text>

    <text fill="#482149" stroke="#482149" stroke-width=".7" font-size="71" font-style="italic"><textPath xlink:href="#jams" startOffset="50%" textLength="880" lengthAdjust="spacingAndGlyphs">Send your jams to the radio</textPath></text>
    <text x="600" y="1156" fill="#482149" font-size="32" font-style="italic">Bring a friend &amp; invite them to share theirs.</text>

    <text fill="#542652" stroke="#542652" stroke-width=".7" font-size="68" font-style="italic"><textPath xlink:href="#vote" startOffset="50%" textLength="840" lengthAdjust="spacingAndGlyphs">Tune in &amp; vote!</textPath></text>
    <text x="600" y="1346" fill="#542652" font-size="30">Listen to the songs. Help your discoveries rise.</text>
  </g>

