      <path d="M-12 3L-7 20H2L-2 5M23-13L28-17M24-3H30M23 7L28 11"/>
    </g>
    <g id="funds-icon" fill="none" stroke="#c9ff32" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
