<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1500" viewBox="0 0 1200 1500">
  <title>The world is your village, Busk from home! - DecentBusking community call</title>
  <desc>A psychedelic Monday poster: check and sync the community calendar, buy ads to fuel the funds and share public announcements, send jams and invite friends, listen and vote.</desc>
  <defs>
    <linearGradient id="electric" x1="0" y1="0" x2="1" y2=".5">
      <stop stop-color="#c7ff00"/><stop offset=".38" stop-color="#39ffe2"/>
      <stop offset=".7" stop-color="#9a7bff"/><stop offset="1" stop-color="#ff40d9"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ff36c9"/><stop offset=".5" stop-color="#ff67f3"/><stop offset="1" stop-color="#a968ff"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2=".5">
      <stop stop-color="#24f1ff"/><stop offset=".5" stop-color="#75ffe0"/><stop offset="1" stop-color="#3bc6ff"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e4ff30"/><stop offset="1" stop-color="#70ff8d"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#a62dff" stop-opacity=".65"/><stop offset="1" stop-color="#1a0738" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
