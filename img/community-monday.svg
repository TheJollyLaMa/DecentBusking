    </g>
    <g id="people-icon" fill="none" stroke="#53ffe2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <circle cy="-12" r="8"/><circle cx="-20" cy="-5" r="6"/><circle cx="20" cy="-5" r="6"/>
