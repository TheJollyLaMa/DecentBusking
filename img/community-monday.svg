  <path d="M85 592C322 512 524 650 751 601S997 533 1115 590L1100 785C899 852 774 748 570 797S243 788 100 825Z" fill="url(#cyan)" stroke="#ab51ff" stroke-width="7"/>
  <path d="M100 818C300 735 435 856 621 813S950 763 1100 815L1110 989C893 1050 752 961 553 1000S240 1003 90 1009Z" fill="url(#pink)" stroke="#ab51ff" stroke-width="7"/>
